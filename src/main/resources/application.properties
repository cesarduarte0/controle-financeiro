spring.application.name=controle-financeiro

# Senha do seu banco local: crie um arquivo "local.properties" ao lado do pom.xml com a linha
#   DB_PASSWORD=sua_senha
# Ele e lido automaticamente e nao vai para o GitHub (esta no .gitignore).
spring.config.import=optional:file:./local.properties

# Banco de dados (pode sobrescrever com variaveis de ambiente)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/financeiro}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Datas em formato ISO (2026-11-15) no JSON
spring.jackson.serialization.write-dates-as-timestamps=false
